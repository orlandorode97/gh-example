name: Deploy Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The namespace to deploy to
        required: true
        type: choice
        options:
          - stage1
          - stage2
          - stage3
  workflow_call:
    inputs:
      environment:
        description: The namespace to deploy to
        type: string
        required: true

jobs:
  deploy:
    name: Deploy Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
      - name: Install dependencies
        run: npm install
      - name: Apply all pending migrations to database
        run: npx prisma migrate deploy
        env:
          DSN: ${{ secrets.DSN }}
