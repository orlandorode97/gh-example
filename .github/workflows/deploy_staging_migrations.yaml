name: Deploy Migrations to Staging

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The namespace where migrations will be deployed
        required: true
        type: choice
        options:
          - stage1
          - stage2
          - stage3
      directory:
        description: The repository containing the Prisma migrations
        required: true
        type: string
      branch:
        description: The repository branch
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        description: The namespace where migrations will be deployed
        type: string
        required: true
      directory:
        description: Define directory description here
        type: string
        required: true
      branch:
        description: The repository branch
        type: string
        required: true

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"

    name: Deploy Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Get Metadata
        id: get_metadata
        with:
          path: "./"
        run: |
          directory=${{inputs.directory}}
          environment=${{inputs.environment}}

          metadata="$directory/metadata-$environment.json"

          secret_name=$(jq -r '.secret_name' "$metadata")
          env_var_name=$(jq -r '.env_var_name' "$metadata")
          github_url=$(jq -r '.github_url' "$metadata")

          # Output to GitHub Actions' environment
          echo "secret_name=$secret_name" >> $GITHUB_ENV
          echo "env_var_name=$env_var_name" >> $GITHUB_ENV
          echo "github_url=$github_url" >> $GITHUB_ENV

          if [[ ! -f "$metadata" ]]; then
            echo "Error: File '$metadata' does not exist."
            exit 1
          fi

          # Extract values using jq
          secret_name=$(jq -r '.secret_name' "$metadata")
          env_var_name=$(jq -r '.env_var_name' "$metadata")
          github_url=$(jq -r '.github_url' "$metadata")

          # Output to GitHub Actions' environment
          echo "secret_name=$secret_name" >> $GITHUB_ENV
          echo "env_var_name=$env_var_name" >> $GITHUB_ENV
          echo "github_url=$github_url" >> $GITHUB_ENV

      - name: Use extracted metadata
        run: |
          echo "Secret Name: ${{ steps.read_json.outputs.secret_name }}"
          echo "Environment Variable Name: ${{ steps.read_json.outputs.env_var_name }}"
          echo "GitHub URL: ${{ steps.read_json.outputs.github_url }}"
